# Stack version pins (ARCHITECTURE-SPINE.md#Stack). Declared here as the single source of
# version truth (the Gradle equivalent of Maven <dependencyManagement>). NO module applies
# these yet — this skeleton story fixes module boundaries only; engine/parser libraries are
# wired in later epics.
[versions]
lucene = "10.5.1"
mcpSdk = "2.0.1"
onnxruntime = "1.29.0"
sqliteJdbc = "3.53.2.1"
jsoup = "1.23.1"
javaparser = "3.28.2"
# Test-only. First test framework in the repo (Story 1.2). Not part of any runtime/serving
# classpath — JUnit is a testImplementation/testRuntimeOnly dependency only.
junitJupiter = "5.11.4"
junitPlatform = "1.11.4"

jetty = "12.1.14"
snakeyaml = "2.4"
jsonSchema = "3.0.6"
jackson = "2.19.2"

[libraries]
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }
mcp-sdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcpSdk" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

jetty-server = { module = "org.eclipse.jetty:jetty-server", version.ref = "jetty" }
jetty-servlet = { module = "org.eclipse.jetty.ee11:jetty-ee11-servlet", version.ref = "jetty" }
yaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
json-schema = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchema" }
jackson = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

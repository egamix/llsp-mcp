# luciad server configuration. Copy to application.yaml and edit.
# Relative paths resolve against this file's directory.
# Quote values that look like numbers ("2024.0"), or YAML reads them as numbers and the file is rejected.
indexRoot: ./app/build/published-index   # where published builds are kept
sourceDefault: "2024.0"                  # label of the SDK source this server serves
port: 8766                               # agents connect to http://127.0.0.1:<port>/mcp
stdio: false                             # also serve MCP on stdin/stdout
